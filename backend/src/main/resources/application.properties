spring.application.name=backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/dhs_database?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/api/v1

# JWT
jwt.secret=dhs-military-secret-key-2026-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000