# Application
spring.application.name=24bp-dog-handbook-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/dhs_database?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=minh
spring.datasource.password=123456

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
