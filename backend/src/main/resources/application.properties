spring.application.name=backend

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dhs_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1
spring.mvc.throw-exception-if-no-handler-found=true

# JWT
jwt.secret=${JWT_SECRET:dhs-military-secret-key-2026-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}

# File upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dwtos0djr}
cloudinary.api-key=${CLOUDINARY_API_KEY:358645264179786}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:8h1HL66aRr-ry3lJ2E-MIUS24BU}
cloudinary.folder=${CLOUDINARY_FOLDER:dog-handbook/media}
